name: Build Kasa APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Kasa APK Derle
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 17 kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9 kurulumu
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Gradle sürümünü kontrol et
        run: gradle --version

      - name: Android APK oluştur
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK dosyasını kontrol et
        run: |
          echo "Oluşturulan APK dosyaları:"
          find app/build/outputs -type f -name "*.apk" -print

      - name: APK'yı GitHub'a yükle
        uses: actions/upload-artifact@v4
        with:
          name: Kasa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
